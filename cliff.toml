# git-cliff configuration (https://git-cliff.org/docs/configuration)
# The release notes and the changelog are generated from conventional commit messages:
#   git cliff --unreleased         what the next release will contain
#   git cliff --latest             the notes of the newest release tag (what the release workflow publishes)
#   git cliff -o CHANGELOG.md      the whole changelog

[changelog]
header = """
# Changelog

All notable changes to RakKomik are documented here.
This file is generated by [git-cliff](https://git-cliff.org) from the commit history.
"""
# The `<!-- n -->` prefixes of the groups only order them; `striptags` removes them again.
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message | upper_first }}
    {%- endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
# commits that do not follow the convention (and merge commits) stay out of the notes
filter_unconventional = true
split_commits = false
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
topo_order = false
commit_parsers = [
    { message = "(?i)^feat", group = "<!-- 0 -->Features" },
    { message = "(?i)^fix", group = "<!-- 1 -->Bug fixes" },
    { message = "(?i)^perf", group = "<!-- 2 -->Performance" },
    { message = "(?i)^refactor", group = "<!-- 3 -->Refactoring" },
    { message = "(?i)^docs?", group = "<!-- 4 -->Documentation" },
    { message = "(?i)^(test|build|ci)", group = "<!-- 5 -->Build, CI and tests" },
    { message = "(?i)^chore\\(release\\)", skip = true },
    { message = "(?i)^(chore|style)", group = "<!-- 6 -->Maintenance" },
]
