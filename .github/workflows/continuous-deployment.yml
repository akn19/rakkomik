# https://help.github.com/en/articles/workflow-syntax-for-github-actions
# https://help.github.com/en/articles/contexts-and-expression-syntax-for-github-actions

name: Continuous Deployment

on:
  push:
    branches:
      - master
      - '*.*.*'

jobs:
  linux:
    #if: github.actor && secrets['HAKUNEKO_PASSPHRASE']
    name: Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ${{ github.repository }} @ ${{ github.ref }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12
      - name: Install NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install packages
        run: pnpm install
      - name: Lint
        run: pnpm run lint
      - name: Check deprecated dependencies
        run: pnpm run check:deprecated
      # Tests are currently disabled, because they do not work properly (unreliable)
      #- name: Test
      #  run: pnpm run test
      - name: Deploy (web)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PEM signing key (contents of key.pem) + its passphrase, both as
          # repository secrets. GITHUB_REF/GITHUB_REPOSITORY/GITHUB_SHA are
          # provided by the runner and select the rolling release channel.
          HAKUNEKO_PRIVATE_KEY: ${{ secrets.HAKUNEKO_PRIVATE_KEY }}
          HAKUNEKO_PASSPHRASE: ${{ secrets.HAKUNEKO_PASSPHRASE }}
        run: pnpm run deploy:web