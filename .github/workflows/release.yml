# https://docs.github.com/actions/writing-workflows/workflow-syntax-for-github-actions
#
# A release is a tag `vX.Y.Z` (no suffix: it becomes the AUR `pkgver`), and the number of the tag is the version of the
# application: the builds write it into package.json and src/app/package.json (scripts/set-version.js), so nothing is
# edited by hand. This is the only workflow that builds installers. Pushing the tag
#   1. writes the release notes with git-cliff (cliff.toml) from the conventional commit messages,
#   2. creates (or updates) the GitHub release with them,
#   3. builds the installers of Windows, Linux and macOS (build-app.yml) and attaches them to the release,
#   4. publishes packaging/aur-bin to the AUR as the package `rakkomik-bin`, the Arch package of the release prebuilt,
#      once the installers are attached and when that is switched on (see below),
#   5. commits the version of the tag to the default branch, so that the two files there say which release was last
#      (only after the release is complete, and only when the tag is newer than the version they have).
# The code is not checked again here: ci.yml checked the commit when it was pushed, so tag a commit whose run is green.
# Run the workflow by hand with the tag as input to publish an existing tag again.
#
# Publishing to the AUR runs when the repository variable PUBLISH_AUR is `true`
# (Settings, Secrets and variables, Actions, Variables) and needs the repository secret
#   AUR_SSH_PRIVATE_KEY   private half of an SSH key whose public half is added to the AUR account
#                         (the first push creates the AUR package when the name is still free)

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish again, e.g. v1.0.0'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    name: GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check the tag
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The tag \"$TAG\" is not of the form vX.Y.Z!"
            exit 1
          fi
      - name: Checkout ${{ github.repository }} @ ${{ env.TAG }}
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
      - name: Generate the release notes (git-cliff)
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file RELEASE_NOTES.md --latest
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file RELEASE_NOTES.md --latest
          fi

  installers:
    name: Installers
    needs: release
    uses: ./.github/workflows/build-app.yml
    with:
      ref: refs/tags/${{ inputs.tag || github.ref_name }}

  attach:
    name: Attach the installers
    needs: installers
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the installers
        uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          merge-multiple: true
          path: installers
      - name: Upload them to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" installers/* --clobber

  version:
    name: Version in the repository
    # a release that was built whole: the files of the default branch then say which version it was
    needs: attach
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Checkout ${{ github.repository }} @ ${{ github.event.repository.default_branch }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Install NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: 24
      # A push with the token of the workflow starts no other workflow, so ci.yml does not run on this commit, and the
      # message is one that git-cliff leaves out of the release notes (cliff.toml). A branch that does not accept pushes
      # without a pull request makes the step fail: allow the workflow to push to it, or set the version by hand.
      - name: Set the version of the tag in the files
        run: |
          if ! git merge-base --is-ancestor "refs/tags/$TAG" HEAD; then
            echo "$TAG is not in the history of $BRANCH: the version of the files stays as it is."
            exit 0
          fi
          node scripts/set-version.js --if-newer "$TAG"
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --all --message "chore(release): set the version to ${TAG#v}"
          git push origin "HEAD:$BRANCH"

  aur:
    name: AUR package
    # runs when the repository variable PUBLISH_AUR is `true` (see the top of this file), and after the installers are
    # attached: the package downloads the Arch package of the release
    if: ${{ vars.PUBLISH_AUR == 'true' }}
    needs: attach
    runs-on: ubuntu-latest
    steps:
      # The PKGBUILD of the workflow's commit and not of the tag: it only downloads the release, so a release from before
      # packaging/aur-bin is published by running the workflow by hand from the default branch.
      - name: Checkout ${{ github.repository }}
        uses: actions/checkout@v7
      - name: Set the package version
        run: sed -i "s/^pkgver=.*/pkgver=${TAG#v}/; s/^pkgrel=.*/pkgrel=1/" packaging/aur-bin/PKGBUILD
      # This action receives the AUR key, so it is pinned to the commit of v4.2.0 (it has no tag for its major version).
      # Without assets it commits only PKGBUILD and .SRCINFO, not the download or the package that makepkg leaves.
      - name: Publish to the AUR
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050
        with:
          pkgname: rakkomik-bin
          pkgbuild: packaging/aur-bin/PKGBUILD
          commit_username: ${{ github.repository_owner }}
          commit_email: ${{ github.repository_owner }}@users.noreply.github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update to ${{ env.TAG }}
          updpkgsums: true
          # build the package once before it is published (installs its dependencies in the action's container)
          test: true
          test_flags: --clean --cleanbuild --syncdeps --noconfirm
