# https://help.github.com/en/articles/workflow-syntax-for-github-actions
# https://help.github.com/en/articles/contexts-and-expression-syntax-for-github-actions

name: Continuous Integration

on: pull_request

jobs:
  pr-integration:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macOS-latest]
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Starting X Virtual Frame Buffer (Port 99)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          #sudo apt-get update
          #sudo apt-get install -y libxkbfile-dev pkg-config libsecret-1-dev libxss1 dbus xvfb libgtk-3-0 libgconf-2-4
          sudo /usr/bin/Xvfb -ac :99 -screen 0 1920x1080x24 > /dev/null 2>&1 &
          disown -ar # remove all running jobs (e.g. xvfb) from the job table of this bash process
      - name: Checkout ${{ github.repository }} @ ${{ github.ref }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12
      - name: Install NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install packages
        run: pnpm install
      - name: Lint
        run: pnpm run lint
      - name: Check deprecated dependencies
        run: pnpm run check:deprecated
      - name: Build (web)
        run: pnpm run build:web
      - name: Test
        env:
          DISPLAY: ':99'
        run: pnpm run test