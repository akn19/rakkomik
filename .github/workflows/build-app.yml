# https://help.github.com/en/articles/workflow-syntax-for-github-actions
# https://help.github.com/en/articles/contexts-and-expression-syntax-for-github-actions

name: Build Desktop Installers

on:
  push:
    branches:
      - main
      - '*.*.*'
  workflow_dispatch:
  # the release workflow builds the installers of a tag with it
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to build, e.g. refs/tags/v1.0.0 (the ref of the run when empty)'
        type: string
        default: ''

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macOS-latest]
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout ${{ github.repository }} @ ${{ inputs.ref || github.ref }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 1
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12
      - name: Install NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install packages
        run: pnpm install
      - name: Install packaging tools (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y fakeroot lintian rpm unzip
      - name: Lint
        run: pnpm run lint
      - name: Check deprecated dependencies
        run: pnpm run check:deprecated
      # builds the web part first, which every installer carries, then the installers of this platform
      - name: Build (app)
        run: pnpm run build:app
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            build/*.deb
            build/*.rpm
            build/*.exe
            build/*.zip
            build/*.dmg
          if-no-files-found: error
