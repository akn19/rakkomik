<!DOCTYPE html>
<html lang="en">
<head> 
    <meta charset="utf-8">
    <title>HakuNeko</title>
    <link rel="icon" href="./img/logo.png">
    <meta name="viewport" content="width=device-width, minimum-scale=1, initial-scale=1, user-scalable=yes">
    <script src="./js/protobufjs.min.js"></script>
    <script src="./js/jszip.min.js" defer></script>
    <script src="./js/sql.min.js" defer></script>
    <script type="module">
        import HakuNeko from './mjs/HakuNeko.mjs'

        // https://github.com/electron/electron/blob/master/docs/api/dialog.md#dialogshowmessageboxbrowserwindow-options
        // Fase 1: dialogs via preload bridge (window.hakuneko) instead of electron.remote.
        function replaceDialogs() {
            alert = async (message, title, type) => {
                let options = {
                    type: type || 'info',
                    title: title || 'HakuNeko',
                    message: message,
                    buttons: [ 'OK' ]
                };
                let response = await window.hakuneko.dialog.showMessageBox(options);
                return response === options.buttons.indexOf('OK');
            };
            confirm = async (message, title, type, buttons) => {
                let options = {
                    type: type || 'question',
                    title: title || 'HakuNeko',
                    message: message,
                    buttons: buttons || [ 'Yes', 'No' ]
                };
                // NOTE: the bridge normalizes showMessageBox to the button index
                // on every Electron version (it used to resolve to an object on
                // some versions, which made confirm() always falsy).
                let response = await window.hakuneko.dialog.showMessageBox(options);
                return response === 0;
            };
        }

        async function loadEngine() {
            console.log('Loading Engine:', 'HakuNeko');
            window.HakuNeko = new HakuNeko(window);
            // TODO: remove backward compatibility alias 'Engine' when all references are set to HakuNeko engine
            window.Engine = window.HakuNeko;
            
            await Engine.initialize();
            // TODO: remove stuff that requires various globals, incl. global HakuNeko engine
            //new HistoryWorker();
            await Engine.Settings.load();
            Engine.BookmarkManager.loadProfile( 'default', undefined );
            Engine.ChaptermarkManager.loadChaptermarks( undefined );
        }

        // Website connectors load in the background (batched, after the UI is shown).
        // Their stored settings are applied (again) once they are registered.
        async function loadConnectors() {
            try {
                await Engine.loadConnectors();
                performance.mark('rk:connectors');
                await Engine.Settings.load();
                performance.mark('rk:settings');
            } catch (error) {
                console.error('Failed to load the connectors:', error);
            }
        }

        async function loadFrontend() {
            // The bundled React UI (built by `pnpm run build:ui`) is mounted
            // AFTER loadEngine(), so window.Engine is ready. It brings its own
            // titlebar with the window controls.
            let container = document.createElement('div');
            container.id = 'react-root';
            document.body.appendChild(container);
            let css = document.createElement('link');
            css.rel = 'stylesheet';
            css.href = './ui/dist/ui.css';
            document.head.appendChild(css);
            let shell = await import('./ui/dist/ui.js');
            shell.mountReactShell(container);
        }

        function closeNotification() {
            let notification = document.querySelector('#notification');
            notification.parentNode.removeChild(notification);
        }

        async function main() {
            performance.mark('rk:main');
            replaceDialogs();
            await loadEngine();
            performance.mark('rk:engine');
            await loadFrontend();
            performance.mark('rk:shell');
            loadConnectors();
        }

        main();
    </script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow-y: hidden;
        }

        #notification {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            margin: 0.5em;
            padding: 0.5em;
            box-shadow: 0px 2px 4px 2px #808080;
            background-color: #fff8f0;
            border: 1px solid #ffc0c0;
            border-radius: 0.25em;
            font-family: sans-serif;
            text-align: center;
            z-index: 2;
        }

        #notification a {
            text-decoration: none;
            cursor: pointer;
        }

        #notification > #close {
            position: absolute;
            margin-top: -2px;
            right: 1em;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="notification">
        A new <strong>HakuNeko Desktop Client</strong> is available for download on
        <a href="https://github.com/manga-download/hakuneko/releases" target="_blank">GitHub</a>
        <span id="close" onclick="closeNotification()" title="Hide notification">✖</span><!-- ❌&times; -->
    </div>
</body>
</html>
