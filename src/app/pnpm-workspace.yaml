# Stand-alone install of src/app (nested: `postinstall` of the root project runs it).
# `nodeLinker: hoisted`: app.asar holds a real `node_modules` tree. Electron cannot `require` through a symlink into
# the `.pnpm` store inside an asar (ENOENT at start). pnpm 11+ only reads authentication settings from `.npmrc`, so
# the setting lives in this file.
packages:
  - .
nodeLinker: hoisted
