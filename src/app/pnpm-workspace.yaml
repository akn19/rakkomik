# Instalasi mandiri src/app (nested, lihat pnpm-workspace.yaml root).
# Menampung `overrides` + `allowBuilds` untuk resolusi discord-rpc.
# Catatan pin: pino 7.11.0 (bukan latest) — lini terakhir yang jalan di
# runtime Node 12 Electron 8; naikkan setelah upgrade Electron (Fase 1).
packages:
  - .
overrides:
  register-scheme: 0.0.2
allowBuilds:
  register-scheme: true
