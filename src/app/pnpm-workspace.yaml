# Instalasi mandiri src/app (nested; dipasang oleh `postinstall` di root).
# `nodeLinker: hoisted`: app.asar berisi pohon `node_modules` fisik — Electron tidak bisa
# `require` lewat symlink ke store `.pnpm` di dalam asar (ENOENT saat start). pnpm 11+ hanya
# membaca pengaturan autentikasi dari `.npmrc`, jadi pengaturannya tinggal di berkas ini.
packages:
  - .
nodeLinker: hoisted
