# Fase 0: nested-install layout (opsi b, AGENTIC-PLAN).
# `src/app` BUKAN anggota workspace ini — ia proyek mandiri dengan pnpm-workspace.yaml
# sendiri, dipasang oleh `postinstall` (`pnpm --dir src/app install`) agar app.asar berisi
# file fisik, bukan symlink store pnpm (alasan dan `nodeLinker` ada di berkas itu).
packages:
  - .
allowBuilds:
  # pnpm memblokir skrip install secara default; paket di bawah ini disetujui
  # karena dibutuhkan tooling (dikelola via `pnpm approve-builds`).
  '@parcel/watcher': true
  core-js: true
  electron: true # unduh biner Electron saat install — wajib untuk start/test
  unrs-resolver: true
