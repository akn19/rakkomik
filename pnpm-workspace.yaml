# Nested install layout: `src/app` is NOT a member of this workspace. It is a project of its own, with a
# pnpm-workspace.yaml of its own, installed by `postinstall` (`pnpm --dir src/app install`) so that app.asar holds
# real files and not symlinks into the pnpm store (the reason and the `nodeLinker` setting are in that file).
packages:
  - .
allowBuilds:
  # pnpm blocks install scripts by default; the packages below are approved because the tooling needs them
  # (managed with `pnpm approve-builds`).
  '@parcel/watcher': true
  core-js: true
  electron: true # downloads the Electron binary on install: required to start and to test
  unrs-resolver: true
